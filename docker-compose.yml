version: "3.8"

# 局域网全栈视频站 LAN Video Station
# 服务: postgres / redis / minio / srs(流媒体) / api(后端) / web(前端+网关) / cdn-edge(可横向扩展)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lvs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lvs_password}
      POSTGRES_DB: ${POSTGRES_DB:-lvs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lvs}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lvs]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lvs]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lvsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lvsminio_secret}
    ports:
      - "9001:9001" # MinIO 控制台（可选暴露）
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [lvs]

  srs:
    image: ossrs/srs:5
    restart: unless-stopped
    command: ["./objs/srs", "-c", "conf/lvs.conf"]
    environment:
      # 局域网内本机 IP，WebRTC 必须；改成宿主机的局域网地址
      CANDIDATE: ${LAN_IP:-192.168.1.100}
    ports:
      - "1935:1935"        # RTMP 推流
      - "8080:8080"        # HTTP-FLV / HLS
      - "1985:1985"        # SRS HTTP API / WHIP / WHEP
      - "8000:8000/udp"    # WebRTC UDP
      - "8000:8000/tcp"    # WebRTC TCP 回落（弱网抗丢包）
    volumes:
      - ./srs/lvs.conf:/usr/local/srs/conf/lvs.conf:ro
    networks: [lvs]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-lvs}:${POSTGRES_PASSWORD:-lvs_password}@postgres:5432/${POSTGRES_DB:-lvs}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lvsminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lvsminio_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      # 站点对外地址（局域网），用于拼接播放直链/推流地址
      PUBLIC_BASE_URL: http://${LAN_IP:-192.168.1.100}
      SRS_RTMP_HOST: ${LAN_IP:-192.168.1.100}
      SRS_HTTP_INTERNAL: http://srs:8080
      SRS_API_INTERNAL: http://srs:1985
      SRS_RTMP_INTERNAL: rtmp://srs:1935
      SRS_CALLBACK_SECRET: ${SRS_CALLBACK_SECRET:-srs_cb_secret}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [lvs]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"   # HTTPS（自签证书，网页推流/连麦需要安全上下文）
    depends_on: [api, srs]
    networks: [lvs]

  # ---- CDN 边缘节点（可复制多份 / 在其他机器单独部署）----
  cdn-edge-1:
    build: ./cdn-edge
    restart: unless-stopped
    environment:
      EDGE_NAME: edge-1
      # 回源地址：直播回源 SRS，点播回源 MinIO
      ORIGIN_LIVE: http://srs:8080
      ORIGIN_STORAGE: http://minio:9000
      # 自动向 API 注册本节点（base_url 为观众可访问到的地址）
      API_BASE: http://api:3000
      EDGE_PUBLIC_URL: http://${LAN_IP:-192.168.1.100}:8081
      REGISTER_TOKEN: ${CDN_REGISTER_TOKEN:-cdn_register_secret}
    ports:
      - "8081:80"
    depends_on: [srs, minio]
    networks: [lvs]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  lvs:
    driver: bridge
