# 前端 + 反向代理网关（站点统一入口 :80）
server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/lvs.crt;
    ssl_certificate_key /etc/nginx/certs/lvs.key;
    client_max_body_size 4096m;   # 大视频上传

    # SPA 静态资源
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket 网关
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 直播流（HTTP-FLV / HLS，来自 SRS）
    # 注意：只匹配流文件后缀，避免吞掉 SPA 的 /live 直播列表/直播间路由
    location ~ ^/live/.+\.(flv|m3u8|ts)$ {
        proxy_pass http://srs:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin * always;
    }

    # WebRTC 信令（WHIP/WHEP，来自 SRS API）
    location /rtc/ {
        proxy_pass http://srs:1985;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
    }

    # 对象存储（视频/缩略图/字幕/录像，来自 MinIO）
    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $proxy_host;
        proxy_force_ranges on;
        add_header Access-Control-Allow-Origin * always;
    }
}
