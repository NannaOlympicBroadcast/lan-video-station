# SRS 5.0 配置 - LAN Video Station
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

rtc_server {
    enabled on;
    listen 8000; # UDP
    candidate $CANDIDATE;
    # Wi-Fi UDP 丢包严重时自动回落 TCP，显著改善卡顿
    tcp {
        enabled on;
        listen 8000;
    }
    protocol all;
}

vhost __defaultVhost__ {
    # RTMP -> WebRTC / WebRTC -> RTMP 互转（网页推流、连麦都依赖）
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    # HTTP-FLV 低延迟播放
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS（移动端/CDN 缓存友好）
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      20;
    }

    # 业务回调 -> 后端鉴权与事件
    http_hooks {
        enabled         on;
        on_publish      http://api:3000/api/callbacks/srs/on_publish;
        on_unpublish    http://api:3000/api/callbacks/srs/on_unpublish;
        on_play         http://api:3000/api/callbacks/srs/on_play;
        on_stop         http://api:3000/api/callbacks/srs/on_stop;
    }
}
